<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Individual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/cadastro.css">
</head>
<body>
        <nav class="navbar">
                <div class="nome-nav">THIAGO</div>
            <ul>
                <li><a>Home</a></li>  
                <li><a>Sobre</a></li>  
                <li><a>Contato</a></li>   
                <button class="btn">Cadastrar</button>
                <button class="btn">Login</button>
            </ul>
           
        </nav>
            <main>
                <section class="background">
                <h1 class="title-background">
                Cadastre-se
                </h1>
                <p>Conheça mais sobre o universo do desenho</p>
                </section>

                <section class="form">
                    <div class="form-container">

                   
                    <h1>Cadastre-se</h1>
                    <p>Preencha todas as informações necessárias para criar a sua conta</p>
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" id="nome">

                    <label for="email">Email</label>
                    <input type="text" name="email" id="email">

                    <label for="senha">Senha</label>
                    <input type="text" name="senha" id="senha">

                    <label for="senha">Confirmar Senha</label>
                    <input type="text" name="senha" id="confirmarSenha">

                    <button class="btn" onclick="cadastrar()">Cadastrar</button>
                    </div>
                </section>
            </main>
            


</body>
</html>

    <script>
        function cadastrar(){
            let nomeUser = nome.value
            let emailUser = email.value
            let senhaUser = senha.value
            let confirmarSehna = confirmarSenha.value

            let temArroba = false
            let temPontoCom = emailUser.endsWith('.com')
            console.log(nomeUser,emailUser,senhaUser)
            // Validação de campos vazios
            if(nomeUser == '' || emailUser == '' || senhaUser == '' || confirmarSehna == ''){
                alert('Preencha todos os campos')
            }
            // Senha não é igual
            if(senhaUser != confirmarSehna){
                alert('As senhas não são iguais')
            }
            // Percorre o email para verificar se o email possui @
            for (let i = 0; i < emailUser.length; i++) {
                if (emailUser[i] == '@') {
                    temArroba = true;
                }
            }
           
            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: { "Content-type":"application/json" },
                body: JSON.stringify(
                    {
                        nomeServer: nomeUser,
                        emailServer: emailUser,
                        senhaServer: senhaUser
                    }
                )
            }).then( resposta => resposta.json())
            .then( res => console.log(res))
                    
        }
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Individual</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
        <nav class="navbar">
                <div class="nome-nav">THIAGO</div>
            <ul>
                <li><a>Home</a></li>  
                <li><a>Sobre</a></li>  
                <li><a>Contato</a></li>   
                <button class="btn">Cadastrar</button>
                <button class="btn">Login</button>
            </ul>
           
        </nav>
            <main>
                <section class="background">
                <h1 class="title-background">
                Faça seu Login
                </h1>
                <p>Conheça mais sobre o universo do desenho</p>
                </section>

                

                <section class="form">
                    <div class="form-container">

                   
                    <h1>Entrar</h1>
                    <p>Preencha os campos para entrar na sua conta</p>
                    
                    
                    <label for="email">Email</label>
                    <input type="text" name="email" id="email">

                    <label for="senha">Senha</label>
                    <input type="text" name="senha" id="senha">
                    
                    <div class="mensagem">
                    <i class="fa-regular fa-circle-check"></i>
                    <span>Usuário logado com sucesso</span> 
                    </div>

                    <button class="btn" onclick="cadastrar()">Cadastrar</button>

                    
                    </div>
                </section>
            </main>
            


</body>
</html>

    <script>
        let msg = document.querySelector('.mensagem')
        function cadastrar(){
            let emailUser = email.value
            let senhaUser = senha.value

            let temArroba = false
            let temPontoCom = emailUser.endsWith('.com')
            console.log(emailUser,senhaUser)
            // Validação de campos vazios
            if( emailUser == '' || senhaUser == ''){
                alert('Preencha todos os campos')
            }
            
            // Percorre o email para verificar se o email possui @
            for (let i = 0; i < emailUser.length; i++) {
                if (emailUser[i] == '@') {
                    temArroba = true;
                }
            }
           
           fetch('/usuarios/autenticar',{
            method:'POST',
            headers: {"Content-type":"application/json"},
            body: JSON.stringify(
                {
                    emailServer: emailUser,
                    senhaServer: senhaUser
                }
            )
           }).then( response => {
                if(response.ok){
                    setTimeout(() => msg.style.display = 'block', 1500)
                    response.json()
                    .then( json => {
                        console.log(json)
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                    })
                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 2500);
                }else{
                    console.log(response)
                }
           })
                    
        }
    </script>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Importa icones do Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!--Importa a biblioteca Chart.js-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!--Importa a função de validar Sessão-->
    <script src="../js/sessao.js"></script>

    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
   
    <title>Exemplo - Quiz</title>
    <link rel="stylesheet" href="../css/quiz.css">
</head>


<body onload="onloadEsconder(), validarSessao()">
    <main>
        <section class="menu-lateral">
        <div class="menu-content">
          <div>
          <span class="logo">drawing.</span>
          <p>Seu espaço</p>
        </div>
            <div class="menu-buttons">
                <button class="btn-menu"><i class="fa-regular fa-clipboard fa-lg"></i><a href="./quiz.html" style="color:rgb(12,12,12);text-decoration: none;">Quiz</a></button>
                <button class="btn-menu"><i class="fa-solid fa-chart-column"></i>Dashboard</button>
            </div>
        </div>

            <div class="menu-container">
                <hr>
            <p class="username">Olá <span id="b_usuario"></span></p>
            <div> <span>Sair</span> <i class="fa-solid fa-arrow-right-from-bracket"></i></div>
        </div>

        </section>
        <section class="conteudo">
            <h1>Quiz</h1>
            <p>Descubra qual estilo de desenho combina mais com você.</p>

        <!--Quiz -->  
        <div id="pontuacaoEJogo">
        <button id="btnIniciarQuiz" onclick="iniciarQuiz()">INICIAR QUIZ</button>

        <div id="pontuacao" class="flex-colunar width-fit-content border-primary">
            
        </div>

        <div id="jogo" class="width-fit-content flex-colunar border-secondary">

             <span id="msgFinal" class="width-fit-content"></span>
             <img id="imagemResultado" src="" alt="Estilo de desenho">

            <div id="infoQuestao" class="padding-8">
                <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span>
                    questões.</span>
            </div>

            <div id="perguntaDaQuestaoAtual" class="padding-8">
                <span id="spanQuestaoExibida" class="text-bold"></span>
            </div>

            <div id="infoAlternativas" class="padding-8">
                <span><em>Escolha uma opção dentre as abaixo:</em></span>
            </div>

            <div id="opcoes" class="flex-colunar padding-8">
                <span>
                    <input type="radio" id="primeiraOpcao" name="option" class="radio" value="0" />
                    <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
                </span>
                <span>
                    <input type="radio" id="segundaOpcao" name="option" class="radio" value="1" />
                    <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
                </span>
                <span>
                    <input type="radio" id="terceiraOpcao" name="option" class="radio" value="2" />
                    <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
                </span>
                <span>
                    <input type="radio" id="quartaOpcao" name="option" class="radio" value="3" />
                    <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
                </span>
                <span>
                    <input type="radio" id="quintaOpcao" name="option" class="radio" value="4" />
                    <label for="quintaOpcao" class="option" id="labelOpcaoCinco"></label>
                </span>
            </div>

            <div id="botoes" class="flex-colunar">
                <button onclick="submeter()" id="btnSubmeter">Submeter resposta</button>
                <button onclick="avancar()" id="btnProx" disabled>Avançar para próxima questão</button>
                <!-- <button onclick="finalizar()" id="btnConcluir" disabled>Finalizar Quiz</button> -->
                <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>Tentar novamente</button>
            </div>

        </div>
    </div>
        </section>

    </main>
   
</body>

</html>
<script>
    const perguntas = [

    {
        pergunta: "O que você mais gosta de desenhar?",

        opcoes: [
            { texto: "Personagens de anime", estilo: "manga" },
            { texto: "Pessoas e rostos realistas", estilo: "realista" },
            { texto: "Personagens em pixels", estilo: "pixel" },
            { texto: "Personagens engraçados", estilo: "cartoon" },
            { texto: "Ícones, logotipos e formas limpas", estilo: "vector" }
        ]
    },

    {
        pergunta: "Qual visual você prefere?",

        opcoes: [
            { texto: "Olhos grandes e expressivos", estilo: "manga" },
            { texto: "Muitos detalhes e sombras", estilo: "realista" },
            { texto: "Visual retrô de videogames", estilo: "pixel" },
            { texto: "Cores fortes e exageradas", estilo: "cartoon" },
            { texto: "Traços perfeitos, simétricos e sem serrilhado", estilo: "vector" }
        ]
    },

    {
        pergunta: "Como você prefere desenhar?",

        opcoes: [
            { texto: "Criando histórias e personagens", estilo: "manga" },
            { texto: "Tentando reproduzir a realidade", estilo: "realista" },
            { texto: "Trabalhando com pequenos quadrados", estilo: "pixel" },
            { texto: "Fazendo desenhos descontraídos", estilo: "cartoon" },
            { texto: "Ajustando curvas, pontos e formas geométricas", estilo: "vector" }
        ]
    },

    {
        pergunta: "Qual ferramenta ou técnica mais chama sua atenção?",

        opcoes: [
            { texto: "Canetas de nanquim e marcadores", estilo: "manga" },
            { texto: "Lápis de grafite e sombreado suave", estilo: "realista" },
            { texto: "Grades e paletas de cores limitadas", estilo: "pixel" },
            { texto: "Traços livres, rápidos e dinâmicos", estilo: "cartoon" },
            { texto: "Formas geométricas e curvas precisas", estilo: "vector" }
        ]
    },

    {
        pergunta: "Onde você gostaria de ver sua arte aplicada?",

        opcoes: [
            { texto: "Na capa de um mangá ou animação", estilo: "manga" },
            { texto: "Em um retrato fiel ou quadro", estilo: "realista" },
            { texto: "Em um jogo indie estilo clássico", estilo: "pixel" },
            { texto: "Em uma tirinha ou desenho animado", estilo: "cartoon" },
            { texto: "Em logotipos, ícones ou ilustrações digitais", estilo: "vector" }
        ]
    }
];

    // variáveis globais    
    let numeroDaQuestaoAtual = 0
    let quantidadeDeQuestoes = perguntas.length
    let pontuacaoEstilos = {
        "manga": 0,
        "realista": 0,
        "pixel": 0,
        "cartoon": 0,
        "vector": 0
    };
    // let isUltima = numeroDaQuestaoAtual == quantidadeDeQuestoes-1 ? true : false

    function onloadEsconder() {
        document.getElementById('pontuacao').style.display = "none"
        document.getElementById('jogo').style.display = "none"
    }

    function iniciarQuiz() {
        document.getElementById('pontuacao').style.display = "flex"
        document.getElementById('jogo').style.display = "flex"
        document.getElementById('btnIniciarQuiz').style.display = "none"

        document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes

        preencherHTMLcomQuestaoAtual(0)

        btnSubmeter.disabled = false
        btnProx.disabled = true
        // btnConcluir.disabled = true
        btnTentarNovamente.disabled = true
    }

    function preencherHTMLcomQuestaoAtual(index) {
        habilitarAlternativas(true)
        const questaoAtual = perguntas[index]
        numeroDaQuestaoAtual = index
        console.log("questaoAtual")
        console.log(questaoAtual)
        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;

        document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.opcoes[0].texto;
        document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.opcoes[1].texto;
        document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.opcoes[2].texto;
        document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.opcoes[3].texto;
        document.getElementById("labelOpcaoCinco").innerHTML = questaoAtual.opcoes[4].texto;
    }

    function submeter() {
        const options = document.getElementsByName("option"); // recupera alternativas no html

        let hasChecked = false
        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) {
                hasChecked = true
                break
            }
        }

        if (!hasChecked) {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
        } else {
            btnSubmeter.disabled = true
            btnProx.disabled = false

            habilitarAlternativas(false)

            contabilizarResposta()
        }
    }

    function habilitarAlternativas(trueOrFalse) {
        let opcaoEscolhida = trueOrFalse ? false : true

        primeiraOpcao.disabled = opcaoEscolhida
        segundaOpcao.disabled = opcaoEscolhida
        terceiraOpcao.disabled = opcaoEscolhida
        quartaOpcao.disabled = opcaoEscolhida
        quintaOpcao.disabled = opcaoEscolhida;

    }

    function avancar() {

    btnProx.disabled = true;
    btnSubmeter.disabled = false;

    desmarcarRadioButtons();

    if (numeroDaQuestaoAtual < quantidadeDeQuestoes - 1) {

        numeroDaQuestaoAtual++;

        preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual);

    } else {

        finalizarJogo();

    }

}

    function tentarNovamente() {
        // atualiza a página
        window.location.reload()
    }

    function contabilizarResposta() {

    const questaoAtual = perguntas[numeroDaQuestaoAtual];

    const options = document.getElementsByName("option");

    let indiceSelecionado = null;

    options.forEach((option) => {
        if (option.checked) {
            indiceSelecionado = option.value; 
        }
    });

    let estiloEscolhido = questaoAtual.opcoes[indiceSelecionado].estilo;

    pontuacaoEstilos[estiloEscolhido]++;

    console.log(pontuacaoEstilos);

}

    function limparCoresBackgroundOpcoes() {
        const options = document.getElementsByName("option");
        options.forEach((option) => {
            document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
            document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
        })
    }

    function desmarcarRadioButtons() {
        const options = document.getElementsByName("option");
        for (let i = 0; i < options.length; i++) {
            options[i].checked = false;
        }
    }

    function finalizarJogo() {

    let maiorPontuacao = Math.max(
        ...Object.values(pontuacaoEstilos)
    );

    let estiloVencedor = Object.keys(pontuacaoEstilos).find(
        estilo => pontuacaoEstilos[estilo] === maiorPontuacao
    );

    const nomesFormatados = {
        "manga": "Anime / Mangá",
        "realista": "Realismo",
        "pixel": "Pixel Art",
        "cartoon": "Cartoon",
        "vector": "Vector Art"
    };

    document.getElementById("msgFinal").innerHTML =
        `Seu estilo artístico é:<br> <b>${nomesFormatados[estiloVencedor]}</b> `
    
        const imagens = {
        manga: "../assets/imgs/manga.jpg",
        realista: "../assets/imgs/realismo.jpg",
        pixel: "../assets/imgs/pixel-art.png",
        cartoon: "../assets/imgs/cartoon.avif",
        vector: "../assets/imgs/vector.avif"
    };

    let img = document.getElementById("imagemResultado")
    img.style.display = 'block'
    img.src = imagens[estiloVencedor];

    


    btnProx.disabled = true;
    btnSubmeter.disabled = true;
    btnTentarNovamente.disabled = false;

    console.log("Resultado: " + estiloVencedor);
    enviarResultado(estiloVencedor)
}

    function enviarResultado(estilo){
        fetch('/quiz/salvar', {
            method: 'POST',
            headers: {'Content-type':'application/json'},
            body: JSON.stringify( {
                idUsuarioServer: sessionStorage.ID_USUARIO,
                estiloServer: estilo
            })
        })
        .then( function (resposta){
            if(!resposta.ok){
                console.log('Erro ao salvar resultado')
            }
            return resposta.json()
        })
        .then( function (res){
            console.log(res.mensagem)
            sessionStorage.ESTILO_ARTE = estilo
        })
        .catch( function (erro){
            console.error(erro)
        })
    }
</script>
